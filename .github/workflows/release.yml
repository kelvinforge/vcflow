name: Release

# VC Flow owns versioning: it creates the release branch, bumps VERSION,
# updates CHANGELOG, merges to production/master and pushes the `vX.Y.Z` tag.
# This workflow never bumps a version and never creates a tag.
#
#   - push tag `v*`        -> build Tauri, create the matching GitHub Release,
#                             upload the bundles as Release assets
#   - workflow_dispatch    -> build only, upload bundles as Actions artifacts,
#                             no Release, no tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # needed to create the GitHub Release on tag push
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - os: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # openssl-sys (via git2 -> libgit2-sys) needs to locate OpenSSL headers.
      # Homebrew ships openssl@3 on the macOS runners; point the build at it.
      - name: Configure OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$OPENSSL_PREFIX/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$OPENSSL_PREFIX/lib -Wl,-undefined,dynamic_lookup" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag push -> publish a GitHub Release named after the tag.
          # manual run -> tagName empty, so tauri-action only builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseBody: 'See the assets to download this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundles as Actions artifacts (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error
