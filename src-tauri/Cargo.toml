[workspace]
members = [".", "crates/git_core", "crates/provider_core", "crates/workflow_engine", "crates/auth_core"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
description = "Git Workflow Engine desktop app"
authors = ["Kelvin Seng"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
git_core = { path = "crates/git_core" }
provider_core = { path = "crates/provider_core" }
workflow_engine = { path = "crates/workflow_engine" }
auth_core = { path = "crates/auth_core" }
git2 = "0.20"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
