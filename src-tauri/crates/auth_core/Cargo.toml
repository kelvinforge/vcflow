[package]
name = "auth_core"
version = "0.1.0"
edition = "2021"

[dependencies]
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
thiserror = "2"
# Token file encryption (credential_store.rs): AES-256-GCM, key derived
# with SHA-256 from the machine ID.
aes-gcm = "0.10"
sha2 = "0.10"
machine-uid = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
