[package]
name = "auth_core"
version = "0.1.0"
edition = "2021"

[dependencies]
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
